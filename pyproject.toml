[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-messaging-reference"
version = "1.0.0"
description = "Real-time messaging platform reference design and prototype: WebSocket gateways, per-conversation ordering, idempotent sends, delivery/read receipts, presence, offline sync, cross-gateway routing"
authors = [{ name = "Shiv Kumar" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "redis>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["messaging"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
ignore_missing_imports = true
